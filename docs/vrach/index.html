:root {
  color-scheme: light;
  --bg: #f5f5f2; --surface: #ffffff; --surface-2: #f0efeb; --surface-3: #e8e7e2;
  --border: #e0dfd9; --border-2: #cfcec7;
  --text: #191917; --text-2: #4f4e49; --muted: #807f78;
  --accent: #2160c4; --accent-bg: #e8effb; --focus: #2160c4;
  --crit: #b3261e; --crit-bg: #fbe9e7; --major: #c2510c; --major-bg: #fcefe4;
  --mod: #8a6400; --mod-bg: #fbf3d7; --minor: #3f5f80; --minor-bg: #e9eff5;
  --syn: #1b7a43; --syn-bg: #e4f3ea; --ok: #1b7a43; --ok-bg: #e4f3ea; --none: #f0efeb;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --band: rgba(27, 122, 67, .10);
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
  --r: 10px;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #131312; --surface: #1c1c1a; --surface-2: #252523; --surface-3: #2e2e2b;
    --border: #33332f; --border-2: #45443f;
    --text: #edece7; --text-2: #bdbcb3; --muted: #8c8b83;
    --accent: #6ea2f0; --accent-bg: #1b2a40; --focus: #6ea2f0;
    --crit: #ff7b72; --crit-bg: #3b1a18; --major: #ffa25e; --major-bg: #3a2414;
    --mod: #e9c04f; --mod-bg: #342b11; --minor: #94b6da; --minor-bg: #1b2734;
    --syn: #57c98a; --syn-bg: #14301f; --ok: #57c98a; --ok-bg: #14301f; --none: #252523;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    --band: rgba(87, 201, 138, .12);
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #131312; --surface: #1c1c1a; --surface-2: #252523; --surface-3: #2e2e2b;
  --border: #33332f; --border-2: #45443f;
  --text: #edece7; --text-2: #bdbcb3; --muted: #8c8b83;
  --accent: #6ea2f0; --accent-bg: #1b2a40; --focus: #6ea2f0;
  --crit: #ff7b72; --crit-bg: #3b1a18; --major: #ffa25e; --major-bg: #3a2414;
  --mod: #e9c04f; --mod-bg: #342b11; --minor: #94b6da; --minor-bg: #1b2734;
  --syn: #57c98a; --syn-bg: #14301f; --ok: #57c98a; --ok-bg: #14301f; --none: #252523;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  --band: rgba(87, 201, 138, .12);
  --shadow: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono, .num { font-family: var(--mono); font-feature-settings: 'tnum'; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -.005em; }
h2 { font-size: 15px; }
h3 { font-size: 14px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }

/* шапка */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.top-in { max-width: 1440px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-size: 16px; }
.brand span { color: var(--muted); font-size: 12.5px; }
.tabs { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 9px; margin-left: auto; }
.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 7px; cursor: pointer; color: var(--text-2); font-weight: 500; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; height: 32px; min-width: 32px; padding: 0 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--text-2); }
.icon-btn:hover { border-color: var(--border-2); color: var(--text); }
.icon-btn svg { width: 16px; height: 16px; }

main { max-width: 1440px; margin: 0 auto; padding: 20px; }
.layout { display: grid; grid-template-columns: minmax(330px, 420px) minmax(0, 1fr); gap: 20px; align-items: start; }
.col-in { position: sticky; top: 72px; display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 92px); overflow: auto; padding-bottom: 4px; scrollbar-width: thin; }
.col-out { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-h .sub { color: var(--muted); font-size: 12.5px; }

/* формы */
.forms { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.fbtn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 8px; text-align: left; cursor: pointer; font-size: 12.5px; line-height: 1.25; color: var(--text-2); display: flex; gap: 7px; align-items: center; min-height: 40px; }
.fbtn svg { width: 18px; height: 18px; flex: none; opacity: .8; }
.fbtn:hover { border-color: var(--border-2); color: var(--text); }
.fbtn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-bg); color: var(--text); font-weight: 500; }
.params { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; margin-top: 12px; }
.fld { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.fld label { font-size: 12px; color: var(--muted); }
.fld .in { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); }
.fld .in:focus-within { border-color: var(--accent); }
.fld input, .fld select { border: 0; background: transparent; padding: 6px 8px; width: 100%; min-width: 0; outline: none; }
.fld .u { color: var(--muted); font-size: 12px; padding-right: 8px; white-space: nowrap; }
select { cursor: pointer; }

/* состав */
.search { position: relative; }
.search input { width: 100%; padding-right: 92px !important; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 8px 10px 8px 32px; outline: none; }
.search input:focus { border-color: var(--accent); }
.search > svg { position: absolute; left: 10px; top: 10px; width: 15px; height: 15px; color: var(--muted); }
.dd { position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--border-2); border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.14); max-height: 320px; overflow: auto; }
.dd-list button { display: flex; width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 10px; cursor: pointer; gap: 8px; align-items: baseline; justify-content: space-between; }
.dd-list button:hover, .dd-list button.on { background: var(--surface-2); }
.dd .en { color: var(--muted); font-size: 12px; }
.dd .cat { color: var(--muted); font-size: 11px; white-space: nowrap; }
.items { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.item { display: grid; grid-template-columns: 1fr 78px 64px 28px; gap: 6px; align-items: center; padding: 6px 6px 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
.item.ex { background: var(--surface-2); }
.item .nm { min-width: 0; }
.item .nm button { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; color: var(--text); font-weight: 500; line-height: 1.3; }
.item .nm button:hover { color: var(--accent); text-decoration: underline; }
.item .meta { font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.item input, .item select { border: 1px solid var(--border); border-radius: 6px; padding: 5px 6px; background: var(--surface); width: 100%; min-width: 0; }
.item input { text-align: right; font-family: var(--mono); }
.item .rm { border: 0; background: transparent; color: var(--muted); cursor: pointer; border-radius: 6px; height: 28px; }
.item .rm:hover { background: var(--crit-bg); color: var(--crit); }
.implicit { font-size: 12px; color: var(--muted); margin-top: 8px; }
.empty { color: var(--muted); font-size: 13px; padding: 14px; border: 1px dashed var(--border-2); border-radius: 8px; text-align: center; }
.ex-list { display: flex; flex-direction: column; gap: 4px; }
.ex-list button { border: 0; background: transparent; text-align: left; padding: 6px 8px; border-radius: 7px; cursor: pointer; color: var(--text-2); display: flex; justify-content: space-between; gap: 8px; }
.ex-list button:hover { background: var(--surface-2); color: var(--text); }
.ex-list .f { color: var(--muted); font-size: 12px; white-space: nowrap; }

/* тяжесть */

.verdict.mod { border-left-color: var(--mod); } .verdict.minor { border-left-color: var(--minor); } .verdict.ok { border-left-color: var(--ok); }
.v-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.verdict.crit .big { color: var(--crit); } .verdict.major .big { color: var(--major); } .verdict.mod .big { color: var(--mod); } .verdict.minor .big { color: var(--minor); } .verdict.ok .big { color: var(--ok); }
.v-title svg { width: 24px; height: 24px; }
.verdict.crit svg.vi { color: var(--crit); } .verdict.major svg.vi { color: var(--major); } .verdict.mod svg.vi { color: var(--mod); } .verdict.minor svg.vi { color: var(--minor); } .verdict.ok svg.vi { color: var(--ok); }
.v-desc { color: var(--text-2); max-width: 80ch; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.stat .k { font-size: 11.5px; color: var(--muted); }
.stat .v { font-family: var(--mono); font-size: 17px; font-weight: 500; line-height: 1.3; }
.stat .d { font-size: 11.5px; color: var(--text-2); }
.counts { display: flex; gap: 6px; flex-wrap: wrap; }

.btn:hover { border-color: var(--accent); color: var(--accent); }

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0e1726; } }
.btn.primary:hover { filter: brightness(1.08); color: #fff; }
.btn svg { width: 15px; height: 15px; }
.est { font-size: 11.5px; color: var(--muted); }

/* находки */
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; color: var(--text-2); }
.chip[aria-pressed="true"] { background: var(--text); color: var(--surface); border-color: var(--text); }

.fnd.crit { border-left-color: var(--crit); } .fnd.major { border-left-color: var(--major); } .fnd.mod { border-left-color: var(--mod); } .fnd.minor { border-left-color: var(--minor); } .fnd.syn { border-left-color: var(--syn); }

/* таблицы */

/* группы */

:root[data-theme="light"] {

}
body { font-size: 15px; }

a, .mlink:hover, .ditem .nm button:hover { color: var(--ni-blue); }

/* карточки */

/* кнопки — пилюли, как на сайте */

.linkbtn { color: var(--ni-blue); }

.verdict { border-left-width: 5px; }

.sev { border-radius: 999px; }
.tip, .toast { background: var(--ni-blue); color: #fff; border-radius: 12px; }

.prose h2 { font-size: 20px; }

}

'use strict';

const SEVW = { 4: 1000, 3: 60, 2: 8, 1: 1, 0: 0 };
const TROCHE_BASES = { peg: { n: 'ПЭГ 1450/3350', id: 'peg_base', heat: 60, pc: 'M' }, gelatin: { n: 'Глицерин-желатиновая', ids: ['gelatin', 'glycerin'], heat: 70, pc: 'M' } };
const SUPP_BASES = { fat: { n: 'Твёрдый жир (Witepsol)', id: 'hardfat', heat: 45, pc: 'L' }, peg: { n: 'ПЭГ 1450/3350', id: 'peg_base', heat: 60, pc: 'M' } };
const COSOLV_ID = { glycerin: 'glycerin', pg: 'pg', peg400: 'peg400', ethanol: 'ethanol' };
const COSOLV_KEY = { glycerin: 'glycerin', pg: 'pg', peg400: 'peg400', ethanol: 'ethanol' };
const COSOLV_RHO = { glycerin: 1.26, pg: 1.04, peg400: 1.13, ethanol: 0.80 };
const LIQUID_IDS = new Set(['mct', 'olive', 'ethanol', 'glycerin', 'pg', 'peg400', 'ps80', 'tocoph', 'dha', 'vite', 'wfi', 'benzylalc']);

function matchSel(m, s) {
  if (s == null) return true;
  if (Array.isArray(s)) return s.some(x => matchSel(m, x));
  if (typeof s === 'function') return !!s(m);
  if (s.startsWith('id:')) return m.id === s.slice(3) || m.base === s.slice(3); // липосомальная/мицеллярная форма наследует правила исходного вещества
  if (s.startsWith('alert:')) return (m.alerts || []).includes(s.slice(6));
  if (s.startsWith('kind:')) return m.kind === s.slice(5);
  return m.T.has(s);
}
function sevFor(spec, pc, A, B, x) {
  if (typeof spec === 'function') spec = spec(A, B, x);
  if (typeof spec === 'number') return spec;
  if (!spec) return 1;
  if (spec[pc] != null) return spec[pc];
  if (pc === 'M') return Math.max(spec.D ?? 0, (spec.W ?? 1) - 1);
  if (pc === 'L') return spec.D ?? 1;
  return 1;
}
function fill(s, A, B) { return String(s || '').replace(/\{A\}/g, A ? A.ru : '').replace(/\{B\}/g, B ? B.ru : ''); }
function isLiquidM(m) { return LIQUID_IDS.has(m.id) || m.T.has('oilbase') || (m.mp != null && m.mp < 20); }
function molW(m) { return m.mw || m.mw_smi || null; }

/* ---------- Контекст формы ---------- */
function formContext(form, P) {
  const F = FORMS[form];
  const x = { form, F, P, phase: F.phase, heat: 0, implicit: [], baseName: '' };
  switch (form) {
    case 'caps': case 'powder': x.pc = 'D'; break;
    case 'oildr': case 'oint': x.pc = 'L'; break;
    case 'troche': { const b = TROCHE_BASES[P.base] || TROCHE_BASES.peg; x.pc = b.pc; x.heat = b.heat; x.baseName = b.n; (b.ids || [b.id]).forEach(id => x.implicit.push(id)); break; }
    case 'supp': case 'vag': { const b = SUPP_BASES[P.base] || SUPP_BASES.fat; x.pc = b.pc; x.heat = b.heat; x.baseName = b.n; x.implicit.push(b.id); break; }
    default: x.pc = 'W';
  }
  if (form === 'caps') { x.implicit.push(P.filler || 'mcc'); if (P.shell === 'gelatin') x.implicit.push('gelatin'); }
  if (form === 'oildr') x.implicit.push(P.oil || 'mct');
  if (form === 'hydro') x.implicit.push('ethanol');
  if ((form === 'drops' || form === 'slspray') && P.cosolv && P.cosolv !== 'none' && +P.cpct > 0) x.implicit.push(COSOLV_ID[P.cosolv]);
  if (form === 'gel') x.implicit.push(P.gelling || 'hec');
  if (form === 'td') x.implicit.push('plo');
  // объём водной фазы на приём, мл
  if (F.liquid) x.V = +P.vdose || 1;
  else if (form === 'powder') x.V = +P.water || 250;
  else if (F.aq) x.V = (+P.mass || 1) * F.aq;
  x.tasteMatters = F.route === 'sl' || form === 'troche' || form === 'powder' || (F.route === 'oral_sl' && +P.sl === 1);
  return x;
}

/* ---------- pH ---------- */
function phItems(rows, V, skipId) {
  return rows.filter(r => r.m.SP.length && r.mg > 0 && r.id !== skipId).map(r => ({ r, c: r.mg / molW(r.m) / V, sp: r.m.SP }));
}
function calcPH(rows, V, skipId) {
  const its = phItems(rows, V, skipId);
  if (!its.length) return null;
  let ph = solvePH(its);
  // учёт нерастворённой части: в раствор переходит не больше растворимости
  for (let k = 0; k < 3; k++) {
    its.forEach(it => {
      const S = solAt(it.r.m, ph);
      const cmax = S != null ? S / molW(it.r.m) : Infinity;
      it.c = Math.min(it.r.mg / molW(it.r.m) / V, cmax * (it.r.cf || 1));
    });
    ph = solvePH(its);
  }
  return ph;
}

/* ---------- Капсулы ---------- */
function capsCalc(rows, P) {
  let vol = 0, mass = 0, liq = 0;
  rows.forEach(r => { if (r.mg > 0) { vol += r.mg / 1000 / bulkDensity(r.m); mass += r.mg; if (isLiquidM(r.m)) liq += r.mg; } });
  let size, n, cap;
  if (P.size && P.size !== 'auto') {
    const c = CAPS.find(c => c[0] === P.size) || CAPS[1]; size = c[0]; cap = c[1]; n = Math.max(1, Math.ceil(vol / cap));
  } else {
    const fit = CAPS.slice().reverse().find(c => c[1] >= vol);
    if (fit) { size = fit[0]; cap = fit[1]; n = 1; }
    else { size = '00'; cap = 0.95; n = Math.ceil(vol / cap); }
  }
  const fillerMg = Math.max(0, (n * cap - vol)) * 1000 * (RHO_ID[P.filler] || 0.4);
  return { vol, mass, size, cap, n, fillerMg, liqFrac: mass ? liq / mass : 0, total: n * (+P.ndose || 1) };
}

/* ---------- Осмоляльность ---------- */
function osmol(rows, V) {
  let osm = 0;
  rows.forEach(r => {
    if (!(r.mg > 0)) return;
    const m = r.m, mw = molW(m);
    if (!mw || m.kind === 'polymer' || m.T.has('gelling') || m.kind === 'enzyme' || m.kind === 'protein') return;
    let i = 1;
    if (m.SP.length) i = m.SP.reduce((a, p) => a + p.n, 0) + m.SP.reduce((a, p) => a + Math.abs(p.z0) * p.n, 0) * (m.SP.length > 1 ? 0.5 : 1);
    else if (m.id === 'nacl') i = 2;
    else if (m.T.has('electrolyte')) i = 2;
    if (m.id === 'nacl' || m.id === 'ki') i = 2;
    let c = r.mg / mw / V; // моль/л
    if (r.S != null && r.conc > r.S) c = r.S / mw;
    osm += c * i * 0.93 * 1000;
  });
  return osm;
}

/* ---------- Анализ ---------- */
function analyze(recipe, opt = {}) {
  const form = recipe.form, P = Object.assign({}, FORM_DEFAULTS[form], recipe.P || {});

  const x = formContext(form, P);
  const findings = [];

  const rows = (recipe.items || []).filter(it => BY[it.id]).map((it, k) => {
    const m = BY[it.id];
    return { k, id: it.id, m, amt: it.amt, unit: it.unit || 'мг', mg: toMg(it, form, P) };
  });
  const implicitRows = x.implicit.filter(id => BY[id] && !rows.some(r => r.id === id)).map(id => ({ id, m: BY[id], mg: 0, implicit: true }));
  x.items = rows.concat(implicitRows);

  if (winRows.length) {

    phInfo.hi = Math.min(...winRows.map(r => r.m.ph[1]));

      add({ sev, cat: 'stab', type: 'pH вне окна стабильности', ids: [r.id].concat(shifters.map(s => s.id)),

    });
    if (phInfo.lo != null && phInfo.lo > phInfo.hi) {
      const conf = [];
      for (let i = 0; i < winRows.length; i++) for (let j = i + 1; j < winRows.length; j++) {

        mech: 'Окна стабильности компонентов в растворе не имеют общей области: ' + conf.map(([a, b]) => `${nm(a)} (${BY[a].ph.map(v => fmt(v, 1)).join('–')}) и ${nm(b)} (${BY[b].ph.map(v => fmt(v, 1)).join('–')})`).join('; ') + '. Любое значение pH разрушает хотя бы один компонент.',
        act: 'Разделить конфликтующие компоненты по разным формам или перейти на сухую форму.' });
    }
  }

  /* ---- Совместимость каждого вещества с формой ---- */
  const hydroEth = form === 'hydro' ? (+P.eth || 0) : ((fr.ethanol || 0) * 100);

    if (m.dmax && r.mg > m.dmax * 20) F1(2, 'Единицы', 'проверьте единицы', `Введённое количество (${fmtMg(r.mg)}) во много раз превышает типичные значения для этого вещества — возможна ошибка единиц (мг/мкг/г).`, 'Проверить единицы измерения.', 'form');
    if (m.dmin && r.mg > 0 && r.mg < m.dmin / 100) F1(1, 'Единицы', 'проверьте единицы', `Введённое количество (${fmtMg(r.mg)}) во много раз ниже типичных значений — возможна ошибка единиц.`, 'Проверить единицы измерения.', 'form');
    if (isEx && !['ethanol', 'glycerin', 'pg', 'peg400', 'mct', 'olive'].includes(r.id)) {
      // вспомогательные вещества проверяем только по основным признакам ниже
    }
    // фаза: растворимость
    if (x.pc === 'W' && F.liquid && r.status === 'взвесь') {
      const df = r.dissFrac;
      let sev = form === 'nasal' || form === 'slspray' ? 3 : 2;
      if (form === 'drops' || form === 'hydro') sev = (df < 0.05 && (m.T.has('lipo') || (m.logP ?? 0) > 3)) ? 3 : 2;
      F1(sev, 'Фаза', `взвесь (растворено ≈ ${fmt(df * 100, 0)}%)`,
        `Концентрация ${fmt(r.conc, 2)} мг/мл превышает оценку растворимости ${fmt(r.S, 3)} мг/мл при pH ${fmt(pH, 1)}${Object.keys(fr).some(k => fr[k] > 0) ? ' с учётом сорастворителей' : ''}. В ${form === 'nasal' || form === 'slspray' ? 'спрее взвесь забивает распылитель и даёт неравномерную дозу; всасывание через слизистую идёт только из раствора' : 'каплях взвесь оседает — неоднородность дозы'}.`,
        m.T.has('lipo') ? 'Масляная форма, мицеллярная/липосомальная субстанция, солюбилизатор (полисорбат 80) или сорастворитель; иначе — капсулы.' : 'Увеличить объём на приём, сорастворитель (глицерин, ПГ), подходящая соль или pH; либо суспензия с загустителем и пометкой «взбалтывать».', 'phys');
    }
    if (x.pc === 'W' && !F.liquid && r.status === 'взвесь' && (form === 'gel' || form === 'cream' || form === 'td') && (form !== 'td')) {
      F1(1, 'Фаза', 'диспергировано (не растворено)', `Концентрация ${fmt(r.conc, 1)} мг/мл в водной фазе выше растворимости ${fmt(r.S, 3)} мг/мл: вещество в основе в виде частиц, проникновение — только из растворённой части.`, 'Микронизировать, предварительно растереть с ПГ/глицерином.', 'phys');
    }
    if (form === 'powder' && r.status === 'взвесь') F1(1, 'Фаза', 'не растворится полностью в напитке', `В ${P.water} мл воды растворится ≈ ${fmt(r.dissFrac * 100, 0)}%: частицы остаются взвесью.`, 'Размешивать перед питьём; для жирорастворимых — капсулы или эмульгированная форма.', 'phys');
    if (x.pc === 'L' && r.oil && r.status === 'взвесь' && !isEx) {
      const sev = form === 'oildr' ? (m.logP != null && m.logP < 0 || m.kind === 'mineral' ? 3 : 2) : 1;
      F1(sev, 'Фаза', 'не растворяется в масле', `Оценка растворимости в масле ${fmt(r.S, 2)} мг/мл при концентрации ${fmt(r.conc, 1)} мг/мл${m.logP != null ? ' (logP ' + fmt(m.logP, 1) + ')' : ''}: вещество будет взвесью, оседает и комкуется.`, form === 'oildr' ? 'Перенести гидрофильный компонент в водную форму или капсулы; в масле — только микронизированная взвесь с загустителем (SiO₂).' : 'Микронизировать; допустимо как суспензионная мазь.', 'phys');
    }
    if (x.pc === 'W' && isLiquidM(m) && (m.T.has('oilbase') || m.T.has('pufa') || m.id === 'vite') && !rows.some(o => o.m.T.has('surfactant') || o.m.T.has('emulsifier'))) {
      F1(form === 'cream' || form === 'td' ? 0 : 3, 'Фаза', 'масло в водной форме', 'Масляная жидкость не смешивается с водной фазой: расслоение.', 'Эмульгатор (полисорбат 80, лецитин) или масляная форма.', 'phys');

      if (x.pc === 'L') F1(2, 'Липосомы', 'в масляной/жировой основе', 'Липосомы — водная дисперсия; в масле они не сохраняют структуру.', 'Водная форма или водная фаза крема.', 'phys');
      if (x.pc === 'D') F1(1, 'Липосомы', 'сухая форма', 'В капсулах и порошке сохраняются только лиофилизированные (порошковые) липосомы; жидкую липосомальную субстанцию в капсулу не перенести.', 'Уточнить у поставщика форму субстанции (порошок / жидкость).', 'phys');
    }

    if (m.kind === 'probiotic') {

      else if (x.heat >= 40) F1(4, 'Жизнеспособность', `нагрев ${x.heat} °C`, 'Пробиотические бактерии погибают при нагреве основы.', 'Только капсулы.');
      else if (x.pc === 'L') F1(1, 'Жизнеспособность', 'масляная суспензия', 'В масле жизнеспособность сохраняется лучше, чем в воде, но ниже, чем в сухих капсулах.', 'Предпочтительны капсулы.');
    }
    if ((m.kind === 'enzyme' || (m.kind === 'protein' && !isEx)) && x.pc === 'W' && F.liquid) F1(2, 'Активность', 'фермент/белок в растворе', 'В водном растворе ферменты теряют активность (денатурация, автолиз протеаз, микробная контаминация); срок годности короткий.', 'Сухая форма; в жидкой — хранение 2–8 °C, короткий BUD (USP <795>: ≤ 14 дней для водных форм в холодильнике).');
    if (m.kind === 'peptide' && (F.route === 'oral' || (F.route === 'oral_sl' && !(+P.sl)))) F1(2, 'Всасывание', 'пептид при проглатывании', 'Пептиды гидролизуются пепсином и панкреатическими протеазами; пероральная биодоступность обычно < 1% без специальных усилителей.', 'Рассмотреть сублингвальную или назальную форму.', 'pharm');
    if (x.heat && !isEx) {

      let sev = 0;
      if (prot) sev = x.heat >= 55 ? 3 : 2; else if (he >= 3) sev = x.heat >= 55 ? 3 : 2; else if (he >= 2) sev = x.heat >= 55 ? 2 : 1;

      else if (m.T.has('hygro') || m.S.mo >= 2) F1(1, 'Влага', 'гигроскопично', 'Поглощает влагу из воздуха — возможно комкование.', 'Плотная тара, осушитель.');

    // свет
    if (!isEx && m.S.li >= 2) F1(m.S.li >= 3 && (x.pc === 'W' || x.pc === 'L') ? 2 : 1, 'Свет', `светочувствительно (li${m.S.li})`, 'Фотодеградация на свету' + (m.iso ? ': ' + m.iso : '.'), 'Тара из тёмного (янтарного) стекла или непрозрачная; хранить в темноте.');
    // окисление / гидролиз в растворе
    if (x.pc === 'W' && !isEx) {
      if (m.S.ox >= 3) F1(2, 'Окисление', 'легко окисляется в растворе', (m.deg || 'Окисление растворённым кислородом.'), 'Антиоксидант (метабисульфит/аскорбат по совместимости, ЭДТА 0,05%), заполнение азотом, минимальный свободный объём, холодильник, короткий срок.');
      else if (m.S.ox >= 2) F1(1, 'Окисление', 'умеренно окисляется', 'Возможна окислительная деградация при длительном хранении раствора.', 'ЭДТА, тёмная тара, холодильник.');
      if (m.S.hy >= 3 && r.phOk !== false) F1(1, 'Гидролиз', 'гидролитически нестабильно', (m.deg || 'Гидролиз в водной среде.'), 'Сухая форма или короткий срок годности, 2–8 °C.');
    }
    if (x.pc === 'L' && (m.T.has('pufa') || m.T.has('carotenoid') || m.id === 'retinol') && !rows.some(o => o.m.T.has('antiox_lipid'))) F1(1, 'Окисление', 'нужен антиоксидант масла', 'Полиеновые и полиненасыщенные соединения окисляются в масле.', 'Добавить токоферол 0,1–0,5% и/или аскорбилпальмитат 0,02%.');
    // вкус
    if (x.tasteMatters && !isEx) {
      const parts = []; let sev = 0;
      if (m.veryBitter) { parts.push('выраженная горечь'); sev = 2; } else if (m.isBitter) { parts.push('горький вкус'); sev = Math.max(sev, 1); }
      if (m.T.has('sulfurodor')) { parts.push('серный запах'); sev = Math.max(sev, 1); }
      if (m.T.has('fishodor')) { parts.push('рыбный запах'); sev = Math.max(sev, 1); }
      if (m.taste && /металл/i.test(m.taste.t || '')) { parts.push('металлический привкус'); sev = Math.max(sev, 1); }
      if (m.T.has('acidic_strong')) { parts.push('резко кислый'); sev = Math.max(sev, 1); }
      if (m.p1 != null && m.p1 >= 10 && r.mg >= 100) { parts.push('щелочной, раздражает слизистую'); sev = Math.max(sev, 2); }

      if ((m.tpsa && m.tpsa > 140) || (mw && mw > 600) || (m.logP != null && m.logP < -2)) F1(1, 'Всасывание', 'низкая проницаемость слизистой', `Полярное вещество (TPSA ${fmt(m.tpsa, 0)} Å², logP ${fmt(m.logP, 1)}, M ${fmt(mw, 0)}): пассивное трансбуккальное всасывание ограничено; большая часть дозы будет проглочена.`, 'Учесть при выборе пути введения.', 'pharm');

// элементные теги (Zn, Mg, …) в синергиях — только для минералов, не для ферментов и экстрактов
DOC_SYN.forEach(R => ['a', 'b'].forEach(k => {
  R[k] = [].concat(R[k]).map(s => (typeof s === 'string' && /^(Zn|Mg|Ca|Fe|Se|Cu|K)$/.test(s)) ? (m => m.kind === 'mineral' && m.T.has(s)) : s);
}));
// класс-дубликат: из одного класса в подсказках — не больше одного вещества и не тот, что уже есть
const DUP_KEYS = ['nadprec', 'Mg', 'Ca', 'Zn', 'Fe', 'Se', 'vitc', 'b6', 'b12', 'iu_d', 'vitk', 'ldopa', 'stilbene', 'bileacid', 'glp1', 'phytoestrogen', 'estromet', 'carotenoid'];
function dupKey(m) { const k = DUP_KEYS.find(t => m.T.has(t)); if (k) return k; if (['mthf', 'folic'].includes(m.id)) return 'folate'; if (['gsh', 'sag', 'gsh_lipo'].includes(m.id)) return 'gsh'; if (['curcumin', 'curc_mic', 'thc'].includes(m.id)) return 'curc'; if (['inositol', 'dci'].includes(m.id)) return null; return null; }

;
/* ===== Врачебная версия: анализ ===== */
'use strict';

function selMatch(m, s) {
  if (s == null) return true;
  if (Array.isArray(s)) return s.some(x => selMatch(m, x));
  if (typeof s === 'function') return !!s(m);
  if (s.startsWith('id:')) return m.id === s.slice(3) || m.base === s.slice(3);
  return m.T.has(s);
}

// противопоказания вещества: [{c, sev, t}] — по каждому состоянию самое строгое
function contraFor(m) {
  const by = {};
  for (const r of CONTRA) {
    if (r.fallback && by[r.c]) continue;
    if (!selMatch(m, r.sel)) continue;
    if (!by[r.c] || by[r.c].sev < r.sev) by[r.c] = { c: r.c, sev: r.sev, t: r.t };
  }
  return Object.values(by);
}

const DOC_SEV = { 3: { k: 'major', t: 'Серьёзно' }, 2: { k: 'mod', t: 'Умеренно' }, 1: { k: 'minor', t: 'Учесть' } };
const CONTRA_SEV = { 3: { k: 'crit', t: 'Противопоказано' }, 2: { k: 'mod', t: 'С осторожностью' }, 1: { k: 'minor', t: 'Учесть' } };

function analyzeDoc(ids, cond = []) {
  ids = [...new Set(ids)].filter(id => BY[id] && BY[id].kind !== 'excipient');
  const ms = ids.map(id => BY[id]);
  const condSet = new Set(cond);
  const inter = [], syn = [];

  // парные фармакологические правила и синергия
  for (let i = 0; i < ms.length; i++) for (let j = 0; j < ms.length; j++) {
    if (i === j) continue;
    const A = ms[i], B = ms[j];
    for (const R of PAIR_RULES) {
      if (R.cat !== 'pharm') continue;
      if (DOC_SKIP_RULES.has(R.id)) continue;
      if (R.a === R.b && j < i) continue;
      if (!matchSel(A, R.a) || !matchSel(B, R.b)) continue;
      if (R.not && (R.not(A) || R.not(B))) continue;
      if (R.when && R.cat !== 'syn' && !R.when(A, B, { pc: 'D', items: [] })) continue;
      if (R.id === 'syn_edta' || R.id === 'syn_taste') continue;
      const key = R.id + ':' + [A.id, B.id].sort().join('|');
      const list = R.cat === 'syn' ? syn : inter;
      if (list.some(f => f.key === key)) continue;
      const sev = R.cat === 'syn' ? 0 : sevFor(R.sev, 'D', A, B, { pc: 'D' });
      if (R.cat !== 'syn' && !(sev > 0)) continue;
      list.push({ key, rule: R.id, sev, type: R.type, ids: [A.id, B.id], t: A.ru + ' + ' + B.ru, mech: fill(R.mech, A, B), act: fill(R.act, A, B), split: !!R.split });
    }
  }
  // синергия: правила базы + врачебные пары
  for (let i = 0; i < ms.length; i++) for (let j = i + 1; j < ms.length; j++) synBetween(ms[i], ms[j]).forEach(f => syn.push(f));
  // группы: суммирование эффектов
  for (const G of GROUP_RULES) {
    const mm = ms.map(m => ({ m, w: G.w(m) })).filter(o => o.w > 0);
    if (mm.length < 2) continue;
    const sum = mm.reduce((a, o) => a + o.w, 0);
    if (sum < G.min) continue;
    const list = mm.map(o => o.m);
    inter.push({ rule: G.id, sev: G.sev(list, sum), type: G.type, ids: list.map(m => m.id), t: list.map(m => m.ru).join(' + '), mech: G.mech, act: G.act, group: true });
  }
  // синергия «пиперин + куркумин» и пр. — объединяем дубли с одинаковым типом не нужно; сортировка
  inter.sort((a, b) => b.sev - a.sev);

  // направленность
  const dirs = {};
  ms.forEach(m => (DIR_OF[m.id] || []).forEach(d => { (dirs[d] = dirs[d] || []).push(m.id); }));
  const dirList = Object.entries(dirs).map(([k, v]) => ({ k, n: DIRS[k].n, ids: v })).sort((a, b) => b.ids.length - a.ids.length || a.n.localeCompare(b.n, 'ru'));

  // противопоказания
  const contra = [];
  ms.forEach(m => contraFor(m).forEach(c => contra.push(Object.assign({ id: m.id }, c))));
  const byCond = {};
  contra.forEach(c => { (byCond[c.c] = byCond[c.c] || []).push(c); });
  const condRows = CONDITIONS.filter(c => byCond[c.k]).map(c => ({ k: c.k, n: c.n, sel: condSet.has(c.k), sev: Math.max(...byCond[c.k].map(x => x.sev)), items: byCond[c.k].sort((a, b) => b.sev - a.sev) }))
    .sort((a, b) => (b.sel - a.sel) || (b.sev - a.sev));
  const patient = condRows.filter(r => r.sel);

  // общие предостережения
  const notes = [];
  ms.forEach(m => GENERAL_NOTES.forEach(n => { if (m.T.has(n.tag)) notes.push({ id: m.id, t: n.t }); }));

  // схема приёма
  const tim = {}; ms.forEach(m => { tim[m.id] = timing(m); });
  const slots = { morning: [], evening: [], any: [] };
  ms.forEach(m => slots[tim[m.id].slot].push(m.id));
  const food = { empty: ms.filter(m => tim[m.id].food === 'empty').map(m => m.id), food: ms.filter(m => tim[m.id].food === 'food').map(m => m.id) };
  const separate = inter.filter(f => f.split && f.sev >= 2 && !f.group).map(f => f.ids);
  const conflictTime = slots.morning.length && slots.evening.length;
  const conflictFood = food.empty.length && food.food.length;
  const schedule = { slots, food, separate, conflictTime: !!conflictTime, conflictFood: !!conflictFood, tim };
  if (conflictFood) inter.push({ rule: 'food_conflict', sev: 1, type: 'Приём относительно еды', ids: food.empty.concat(food.food), t: 'Разные требования к приёму пищи',
    mech: `Натощак лучше принимать: ${food.empty.map(nm).join(', ')}; во время еды — ${food.food.map(nm).join(', ')}. В одной форме часть веществ будет приниматься в неоптимальных условиях.`,
    act: 'Если состав в одной форме — выбрать время по приоритетному компоненту или разделить на два приёма.', split: true });

  // разделение на приёмы (раскраска графа)
  const edges = [];
  inter.forEach(f => { if (f.split && f.sev >= 2 && !f.group) edges.push([f.ids[0], f.ids[1]]); });
  if (conflictTime) slots.morning.forEach(a => slots.evening.forEach(b => { if (!edges.some(e => e.includes(a) && e.includes(b))) edges.push([a, b]); }));
  const groups = edges.length ? colorGraph(ids, edges) : null;

  // вердикт
  const pMax = patient.length ? Math.max(...patient.map(r => r.sev)) : 0;
  const iMax = inter.length ? Math.max(...inter.map(f => f.sev)) : 0;
  let verdict;
  if (pMax >= 3) verdict = { k: 'crit', t: 'Противопоказано пациенту', d: 'В составе есть вещества, противопоказанные при отмеченных состояниях. См. блок «Противопоказания».' };
  else if (iMax >= 3) verdict = { k: 'major', t: 'Есть серьёзные противоречия', d: 'Компоненты противоречат друг другу или их эффекты опасно суммируются. Рекомендуется изменить состав или разделить приём.' };
  else if (iMax >= 2 || pMax >= 2) verdict = { k: 'mod', t: 'Допустимо с оговорками', d: 'Сочетание возможно при соблюдении рекомендаций: время приёма, контроль показателей, осторожность при отмеченных состояниях.' };
  else verdict = { k: 'ok', t: syn.length ? 'Сочетание оправдано' : 'Противоречий не найдено', d: syn.length ? 'Существенных противоречий нет, есть полезные сочетания.' : 'Существенных противоречий по базе не найдено.' };
  if (!ms.length) verdict = null;

  return { ids, ms, cond: [...condSet], inter, syn, dirList, condRows, patient, notes, schedule, groups, verdict };
}

/* ---------- Синергия пары ---------- */
const SYN_CACHE = new Map();
function synBetween(A, B) {
  const ck = A.id < B.id ? A.id + '|' + B.id : B.id + '|' + A.id;
  if (SYN_CACHE.has(ck)) return SYN_CACHE.get(ck);
  const out = [], seen = new Set();
  const push = (X, Y, type, mech, rule) => { if (seen.has(type)) return; seen.add(type); out.push({ key: rule + ':' + ck, rule, sev: 0, type, ids: [X.id, Y.id], t: X.ru + ' + ' + Y.ru, mech }); };
  for (const [X, Y] of [[A, B], [B, A]]) {
    for (const R of PAIR_RULES) {
      if (R.cat !== 'syn' || DOC_SKIP_RULES.has(R.id)) continue;
      if (!matchSel(X, R.a) || !matchSel(Y, R.b)) continue;
      if (R.not && (R.not(X) || R.not(Y))) continue;
      push(X, Y, R.type, fill(R.mech, X, Y), R.id);
    }
    for (const [k, R] of DOC_SYN.entries()) {
      if (!selMatch(X, R.a) || !selMatch(Y, R.b) || X.id === Y.id) continue;
      if (R.not && (R.not(X) || R.not(Y))) continue;
      push(X, Y, R.type, R.t, 'dsyn' + k);
    }
  }
  SYN_CACHE.set(ck, out);
  return out;
}
// подсказки: чем можно усилить состав (синергия с выбранными, без серьёзных взаимодействий и противопоказаний пациенту)
function suggest(r, limit = 8) {
  if (!r.ms.length) return [];
  const have = new Set(r.ids), cand = [];
  for (const o of LIST) {
    if (o.kind === 'excipient' || have.has(o.id)) continue;
    const with_ = r.ms.filter(m => synBetween(m, o).length);
    if (!with_.length) continue;
    if (r.cond.length && contraFor(o).some(c => r.cond.includes(c.c) && c.sev >= 2)) continue;
    const t = analyzeDoc(r.ids.concat(o.id), []);
    if (t.inter.some(f => f.sev >= 2 && f.ids.includes(o.id))) continue;
    cand.push({ id: o.id, with: with_.map(m => m.id), type: synBetween(with_[0], o)[0].type, rx: o.T.has('rx') });
  }
  const PREF = ['cacit', 'mgbis', 'znbis', 'fefum', 'mecbl', 'mthf', 'vitc', 'p5p', 'vitd3', 'vitk2', 'semet', 'nmn', 'resv', 'dha', 'curcumin', 'gsh'];
  const pr = id => { const i = PREF.indexOf(id); return i < 0 ? 99 : i; };
  const haveKeys = new Set(r.ms.map(dupKey).filter(Boolean)), used = new Set();
  return cand.filter(c => !c.rx).sort((a, b) => b.with.length - a.with.length || pr(a.id) - pr(b.id) || nm(a.id).localeCompare(nm(b.id), 'ru'))
    .filter(c => { const k = dupKey(BY[c.id]); if (!k) return true; if (haveKeys.has(k) || used.has(k)) return false; used.add(k); return true; })
    .slice(0, limit);
}

/* ---------- Карточка: партнёры по синергии и взаимодействиям ---------- */
function partners(id) {
  const m = BY[id]; const syn = [], inter = [];
  for (const o of LIST) {
    if (o.id === id || o.kind === 'excipient') continue;
    synBetween(m, o).forEach(f => syn.push({ id: o.id, type: f.type }));
    const r = analyzeDoc([id, o.id]);
    r.inter.filter(f => !f.group && f.rule !== 'food_conflict').forEach(f => inter.push({ id: o.id, sev: f.sev, type: f.type }));
  }
  const uniq = a => { const s = {}; a.forEach(x => { if (!s[x.id] || (x.sev || 0) > (s[x.id].sev || 0)) s[x.id] = x; }); return Object.values(s); };
  return { syn: uniq(syn), inter: uniq(inter).sort((a, b) => b.sev - a.sev) };
}

/* ---------- Текст заключения ---------- */
function docReport(r) {
  const L = [];
  L.push('ЗАКЛЮЧЕНИЕ ПО СОСТАВУ (оценка по базе взаимодействий; решение — за врачом)');
  L.push('Состав: ' + r.ms.map(m => m.ru).join('; '));
  if (r.cond.length) L.push('Пациент: ' + r.cond.map(c => COND_N[c]).join('; '));

/* ===== Врачебная версия: совместимость с формами доставки =====
 * Для каждой формы прогоняется технологический анализ (движок версии технолога),
 * врачу показывается только итог: Предпочтительно / Можно / С ограничениями / Нельзя и причина простыми словами. */
'use strict';

const DOC_FORMS = ['caps', 'powder', 'drops', 'hydro', 'oildr', 'slspray', 'troche', 'gummy', 'nasal', 'cream', 'td', 'gel', 'oint', 'supp', 'vag'];
const GUMMY = { n: 'Мармелад (gummies)', bases: { pectin: { n: 'пектиновая основа', acid: true }, gelatin: { n: 'желатиновая основа', acid: false } }, mass: 3 };
const formName = f => f === 'gummy' ? GUMMY.n : FORMS[f].n;
const RATING = {
  best: { k: 'ok', t: 'Предпочтительно', o: 0 },
  ok: { k: 'minor', t: 'Можно', o: 1 },
  limit: { k: 'mod', t: 'С ограничениями', o: 2 },
  no: { k: 'crit', t: 'Нельзя', o: 3 }
};

// рекомендуемая форма в аптеке → формы
const BF_MAP = [
  [/только капсулы/, ['caps'], true],
  [/капсул|таблет/, ['caps']],
  [/напит|порош/, ['powder']],
  [/сублингв/, ['slspray', 'troche', 'drops']],
  [/жидк|сироп/, ['drops']],
  [/трансдерм/, ['td']],
  [/крем/, ['cream']],
  [/гель/, ['gel']],
  [/любые/, ['caps', 'powder', 'drops', 'slspray', 'troche', 'gummy']]
];
function bfForms(m) {
  const bf = (m.pharm && m.pharm.bf) || ''; const out = new Set(); let only = false;
  BF_MAP.forEach(([re, fs, o]) => { if (re.test(bf)) { fs.forEach(f => out.add(f)); if (o) only = true; } });
  return { set: out, only };
}

// короткое имя: без пояснений в скобках
const sn = id => (BY[id] ? BY[id].ru : id).replace(/\s*\([^)]*\)/g, '').replace(/\s*\/.*$/, '').trim();

/* ---------- Путь введения: для каких веществ имеют смысл непероральные формы ---------- */
const ROUTE_OF = { caps: 'oral', powder: 'oral', drops: 'oral', hydro: 'oral', oildr: 'oral', slspray: 'oral', troche: 'oral', gummy: 'oral', nasal: 'nasal', cream: 'topical', gel: 'topical', oint: 'topical', td: 'td', supp: 'rectal', vag: 'vaginal' };
const ROUTE_N = { nasal: 'интраназально', topical: 'наружно', td: 'трансдермально', rectal: 'ректально', vaginal: 'вагинально' };
const isHormone = m => ['hormone', 'androgen', 'estrogen', 'progestogen'].some(t => m.T.has(t));
const idset = s => new Set(s.split(' '));
const ROUTE_OK = {
  oral: () => true,
  nasal: (m, S = idset('mecbl cncbl nad nadh gsh gsh_lipo hyaluronate xylitol')) => m.kind === 'peptide' || S.has(m.id),
  topical: (m, S = idset('calendula aloe chamomile horsechest plantain bpc157 sflecithin nag retinol vitc vitc_lipo nam vite coq10 resv ferulic egcg ala hyaluronate pea curcumin curc_mic boswellia glycyrrhizin astax gsh gsh_lipo nad carnosine ergo sod catalase niacin arg cit pantoth zngluc quercetin chondroitin glucosamine bromelain')) => isHormone(m) || S.has(m.id),
  td: (m, S = idset('melatonin pea mecbl cncbl dhea preg')) => isHormone(m) || S.has(m.id),
  rectal: (m, S = idset('prog gsh gsh_lipo curcumin curc_mic curc_lipo butyrate sily_lipo')) => S.has(m.id),
  vaginal: (m, S = idset('e2 e3 prog dhea hyaluronate vite calendula aloe')) => S.has(m.id)

// причина простыми словами по правилу находки
function reasonOf(f) {
  const A = f.ids && f.ids[0] ? sn(f.ids[0]) : '', B = f.ids && f.ids[1] ? sn(f.ids[1]) : '';
  const r = f.rule || '';
  if (r === 'ph_window') return `${A} разрушается в среде этой формы`;
  if (r === 'ph_overlap') return 'компонентам нужна разная кислотность среды';
  if (r === 'acidlabile_acid') return `${A} разрушается в кислой среде (из-за: ${B})`;
  if (r === 'baselabile_base') return `${A} разрушается в щелочной среде (из-за: ${B})`;
  if (r === 'redoxmetal_reducing' || r === 'cu_thiol' || r === 'oxidant_reducing' || r === 'pufa_metal') return `${A} окисляет ${B}`;
  if (r === 'peroxide_oxprone') return `${B} окисляется основой`;
  if (r === 'maillard' || r === 'dha_browning') return `${A} и ${B} реагируют между собой (потемнение)`;
  if (r === 'vitc_b12') return `витамин C разрушает ${B}`;
  if (r === 'protease_protein') return `${A} расщепляет ${B}`;

  if (r === 'effervescent_acid') return 'газообразование в упаковке';
  if (r === 'deliq_pair' || r === 'gelatin_hygro') return 'смесь отсыревает и слипается';
  if (r === 'lowmp_eutectic') return 'смесь становится липкой';
  if (/^(unit_load|liq_load|caps_load|gummy_load)$/.test(r)) return f.short || 'слишком большой объём веществ для этой формы';
  if (r === 'caps_liq') return 'много жидких компонентов';
  if (r === 'osm' || r === 'nasal_ph') return 'раздражает слизистую носа';
  if (r === 'sl_ph') return 'раздражает слизистую рта';
  if (r === 'skin_ph') return 'раздражает кожу';
  if (r === 'carbomer_ph' || r === 'polyval_carbomer') return 'гелевая основа разжижается';
  if (r === 'oil_choice') return 'большинство веществ не растворяется в масле';
  if (r === 'gummy_acid') return `${A} разрушается в кислой мармеладной основе`;
  if (r === 'gummy_maillard') return `${A} темнеет с сахарным сиропом при варке`;
  if (r.startsWith('form_')) {
    const t = r.slice(5);
    if (t === 'Фаза') return /гелеобраз/.test(f.t) ? `${A} превращает жидкость в гель` : /этанол/.test(f.t) ? `${A} выпадает в осадок в спирте` : /масл/.test(f.t) && /водной/.test(f.t) ? `${A} не смешивается с водой` : /сухой/.test(f.t) ? `${A} — жидкость в сухой форме` : /масле/.test(f.t) ? `${A} не растворяется в масле` : `${A} не растворяется — взвесь`;
    if (t === 'Нагрев') return `${A} разрушается при нагреве основы`;
    if (t === 'Жизнеспособность') return `${A} погибает в этой форме`;
    if (t === 'Активность') return `${A} теряет активность в растворе`;
    if (t === 'Всасывание') return /проглатыв/.test(f.t) ? `${A} разрушается при проглатывании` : `${A} плохо всасывается через слизистую`;
    if (t === 'Проницаемость кожи') return `${A} плохо проникает через кожу`;
    if (t === 'Вкус') return `неприятный вкус: ${A}`;
    if (t === 'Влага') return `${A} впитывает влагу`;
    if (t === 'Окисление') return `${A} окисляется при хранении`;
    if (t === 'Гидролиз') return `${A} нестабилен в воде`;
    if (t === 'Свет') return `${A} чувствителен к свету`;
    if (t === 'Основа') return `${A} несовместим с основой`;
    if (t === 'Консервант') return 'консервант не работает';
    if (t === 'Единицы') return `проверьте дозу ${A}`;
  }
  return (f.type || '') + (A ? ': ' + A : '');
}

// находки, относящиеся к форме (без фармакологии состава — она в отдельных блоках)
// упаковка и хранение (свет, умеренная влага) — не довод против формы
function formFindings(res) {
  return res.findings.filter(f => f.cat !== 'syn' && !f.group && !(f.rule || '').startsWith('single_') && !(f.cat === 'pharm' && !f.item) && !/^g_/.test(f.rule || '')
      && f.rule !== 'form_Свет' && !(f.rule === 'form_Влага' && f.sev < 3) && f.rule !== 'form_Единицы')
    .map(f => (f.rule === 'form_Всасывание' && /проглатыв/.test(f.t)) ? Object.assign({}, f, { sev: 3 }) : f);
}

function itemsFor(ids, dose) {
  return ids.map(id => {
    const d = dose && dose[id];
    if (d && +d.amt > 0) return { id, amt: +d.amt, unit: d.unit || 'мг' };
    const a = defaultAmount(BY[id]); return { id, amt: a.amt, unit: a.unit, typical: true };
  });
}

// мармелад: анализ через основу троше (нагрев, вкус, сладкая основа) + свои проверки
function analyzeGummy(items, base) {
  const res = analyze({ form: 'troche', P: { base: 'gelatin', mass: GUMMY.mass }, items });
  const B = GUMMY.bases[base];
  res.findings = res.findings.filter(f => f.rule !== 'unit_load').map(f => Object.assign({}, f, { t: String(f.t).replace(/троше/g, 'мармелада'), mech: String(f.mech).replace(/троше/g, 'мармелада') }));
  const act = res.rows.filter(r => r.m.kind !== 'excipient');
  const mg = act.reduce((a, r) => a + r.mg, 0), load = mg / (GUMMY.mass * 1000) * 100;
  const sev = load > 50 ? 4 : load > 30 ? 3 : load > 15 ? 2 : 0;

  if (B.acid) act.forEach(r => { if (r.m.ph && r.m.ph[0] > 4 && !(r.m.ph[0] <= 1 && r.m.ph[1] >= 13) || r.m.T.has('acidlabile')) res.findings.push({ sev: r.m.T.has('acidlabile') ? 4 : 3, cat: 'stab', rule: 'gummy_acid', ids: [r.id], item: r.id, t: `${r.m.ru}: кислая основа`, mech: 'Пектиновый мармелад застывает только в кислой среде (pH ≈ 3–3,5).', act: 'Желатиновая основа без кислоты или другая форма.' }); });
  act.forEach(r => { if ((r.m.T.has('amine1') || r.m.kind === 'peptide') && r.m.kind !== 'mineral') res.findings.push({ sev: 2, cat: 'chem', rule: 'gummy_maillard', ids: [r.id], item: r.id, t: `${r.m.ru}: реакция с сахарным сиропом`, mech: 'Аминокислоты при варке с глюкозным сиропом темнеют (реакция Майяра).', act: 'Вводить при остывании основы, сахарозаменитель вместо сиропа.' }); });
  res.summary.load = load; res.gummyBase = base;

}

function scoreF(fs) { return fs.reduce((a, f) => a + ({ 4: 1000, 3: 60, 2: 8, 1: 1 }[f.sev] || 0), 0); }

// оценка всех форм для набора веществ
function formsFor(ids, dose) {
  if (!ids.length) return null;
  const items = itemsFor(ids, dose);
  const ms = ids.map(id => BY[id]);
  const rows = DOC_FORMS.map(f => {
    let res, note = '';
    if (f === 'gummy') {
      const a = analyzeGummy(items, 'pectin'), b = analyzeGummy(items, 'gelatin');
      res = scoreF(formFindings(a)) <= scoreF(formFindings(b)) ? a : b;
      note = GUMMY.bases[res.gummyBase].n;
    } else res = analyze({ form: f, P: {}, items });
    const route = ROUTE_OF[f];
    const fit = ms.filter(m => ROUTE_OK[route](m) || (m.base && ROUTE_OK[route](BY[m.base])));
    if (!fit.length || (route !== 'oral' && fit.length < ms.length)) return { f, n: formName(f), route, rating: 'na', score: 1e6, reasons: [], note: '' };
    const fs = formFindings(res).sort((x, y) => y.sev - x.sev);
    let mx = fs.length ? fs[0].sev : 0;
    // рекомендации аптеки по веществам
    let bfHit = 0, onlyCaps = [];
    ms.forEach(m => { const b = bfForms(m); if (b.set.has(f)) bfHit++; if (b.only && f !== 'caps') onlyCaps.push(m.id); });
    let score = scoreF(fs) - bfHit * 3;
    let rating = mx >= 4 ? 'no' : mx >= 3 ? 'limit' : 'ok';
    const reasons = [...new Set(fs.filter(x => x.sev >= Math.max(2, mx - 1)).map(reasonOf))].slice(0, 2);
    if (fit.length < ms.length) { const rest = ms.filter(m => !fit.includes(m)); if (rating !== 'no') rating = 'limit'; reasons.unshift(rest.map(m => sn(m.id)).join(', ') + ' — не применяется ' + ROUTE_N[route]); score += 60; }
    if (onlyCaps.length && rating === 'ok') { rating = 'limit'; reasons.unshift(onlyCaps.map(sn).join(', ') + ' — в аптеке только в капсулах'); score += 60; }
    return { f, n: formName(f), route: f === 'gummy' ? 'oral' : FORMS[f].route, rating, mx, score, reasons, note, bfHit, res };
  });

  const okRows = rows.filter(r => r.rating === 'ok').sort((a, b) => a.score - b.score);
  if (okRows.length) { const best = okRows[0].score; okRows.filter(r => r.score <= best + 4).slice(0, 3).forEach(r => { r.rating = 'best'; }); }
  rows.forEach(r => { if (r.rating === 'best' && !r.reasons.length) r.reasons = [r.bfHit ? 'рекомендуемая форма в аптеке' : 'противоречий с формой нет']; });
  const na = rows.filter(r => r.rating === 'na').map(r => r.f);
  rows.splice(0, rows.length, ...rows.filter(r => r.rating !== 'na'));
  rows.sort((a, b) => RATING[a.rating].o - RATING[b.rating].o || a.score - b.score);
  // если ничего не подходит целиком — разделение
  let split = null;
  if (!rows.some(r => r.rating === 'best' || r.rating === 'ok') && ids.length > 1) {
    const base = rows.filter(r => r.f !== 'gummy' && r.res).sort((a, b) => a.score - b.score)[0];
    const sp = suggestSplit(base.res);
    if (sp && sp.groups.length > 1) split = sp.groups.map(g => ({ ids: g.ids, form: g.form, rating: g.res ? (g.res.maxSev >= 4 ? 'no' : g.res.maxSev >= 3 ? 'limit' : 'ok') : 'ok' }));
  }
  return { rows, na, split, typical: items.some(i => i.typical) };
}

/* ---------- О методе ---------- */
function renderMethod() {
  $('#method').innerHTML = `<h2 style="margin-top:0">О методе</h2>

<h3>Синергия</h3><p>Известные полезные сочетания: биодоступность (пиперин, фосфолипиды, липиды), кофакторы (D3 + K2, магний + D3, B12 + фолат + B6), восполнение дефицита (метформин + B12), общие пути (цитруллин + аргинин, ФДЭ-5 + донаторы NO).</p>
<h3>Взаимодействия</h3><p>Суммирование эффектов (гипогликемический, антиагрегантный, гипотензивный, седативный, стимулирующий, серотонинергический, нагрузка на печень), антагонизм и противоположное время приёма, конкуренция за всасывание (железо и кальций, транспорт аминокислот), ингибирование ферментов метаболизма (CYP3A4, CYP1A2, P-гликопротеин).</p>
<p>Тяжесть: <b>Серьёзно</b> — изменить состав или разделить приём; <b>Умеренно</b> — допустимо с контролем; <b>Учесть</b> — справочно.</p>
<h3>Противопоказания</h3><p>Для 17 клинических ситуаций (беременность, антикоагулянты, сахароснижающая терапия, гипертензия, антидепрессанты, гормонозависимые опухоли, щитовидная железа, печень, почки и др.) у каждого вещества отмечено: <b>противопоказано</b>, <b>с осторожностью</b> или <b>учесть</b>. Отмеченные состояния пациента выносятся в начало и определяют вердикт.</p>
<h3>Мишени и метаболическая нагрузка</h3><p>Для каждого вещества указаны рецепторы, ферменты-мишени, пути метаболизма и выведения, а также ферменты, которые вещество тормозит или ускоряет (DrugBank, Natural Medicines, обзоры по фармакокинетике; данные in vitro помечены). Нагрузка на фермент считается по числу веществ состава, которые через него выводятся (основной путь — 1, минорный — 0,5): 1 — низкая, 2 — умеренная, 3 и более — высокая. Если в составе есть ингибитор этого фермента, нагрузка повышается на ступень. Для высокоёмких путей (глюкуронидация, сульфатирование, почки) нагрузка не выше умеренной; при отмеченной ХБП нагрузка на почки повышается. Ферменты, которые состав тормозит или ускоряет без собственных субстратов, показаны отдельно — это важно для других препаратов пациента. Общие мишени — рецепторы и ферменты, на которые действуют два и более вещества.</p>
<h3>Схема приёма</h3><p>Время суток и связь с едой — по фармакологии (стимуляторы утром, седативные вечером, жирорастворимые с едой). Конфликтующие пары разносятся по разным приёмам (раскраска графа конфликтов).</p>
<h3>Ограничения</h3><ul><li>Справочная оценка по базе из 221 активного вещества; не учитываются дозы, индивидуальные особенности и полный список принимаемых препаратов.</li><li>Перечень противопоказаний не исчерпывающий — для рецептурных препаратов действует инструкция.</li><li>Решение о назначении принимает врач.</li></ul>
<h3>Источники</h3><ul><li>Natural Medicines Comprehensive Database; Stockley's Drug Interactions; Stockley's Herbal Medicines Interactions.</li><li>Инструкции по медицинскому применению рецептурных препаратов.</li><li>Обзорные публикации по отдельным сочетаниям (Shoba 1998 — пиперин и куркумин; Sekhar 2021 — GlyNAC и др.).</li></ul>`;
}

function pkReport(r) {
  if (!r || !r.ids.length) return '';
  const L = pkLoad(r.ids); const rows = L.rows.filter(x => x.sub.length && x.lvl >= 2);
  if (!rows.length && !L.shared.length) return '';
  const out = ['', 'Метаболическая нагрузка:'];
  rows.forEach(x => out.push(`  ${x.n} — ${LOAD_N[x.lvl].t.toLowerCase()}: ${x.sub.map(s => sn(s.id)).join(', ')}${x.inh.length ? '; тормозят: ' + x.inh.map(s => sn(s.id)).join(', ') : ''}${x.ind.length ? '; ускоряют: ' + x.ind.map(s => sn(s.id)).join(', ') : ''}`));
  if (L.shared.length) out.push('  Общие мишени: ' + L.shared.map(t => `${t.k} (${t.ids.map(sn).join(', ')})`).join('; '));
  return '\n' + out.join('\n');
}
function formsReport(F) {
  if (!F) return '';
  const L = ['', 'Формы доставки' + (F.typical ? ' (где доза не указана — по типичной)' : '') + ':'];
  ['best', 'ok', 'limit', 'no'].forEach(k => { const rs = F.rows.filter(r => r.rating === k); if (rs.length) L.push(`  ${RATING[k].t}: ` + rs.map(r => r.n + (r.reasons.length && k !== 'best' ? ` (${r.reasons[0]})` : '')).join('; ')); });
  if (F.split) L.push('  Разделить: ' + F.split.map((g, i) => `${i + 1}) ${g.ids.map(sn).join(', ')} — ${formName(g.form).toLowerCase()}`).join('; '));
  return '\n' + L.join('\n');
}

/* ---------- Сервис ---------- */
function copyText(t) {
  const done = () => toast('Заключение скопировано');
  const fb = () => { const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Не удалось скопировать'); } ta.remove(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, fb); else fb();
}
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1800); }
function themeGet() { try { return localStorage.getItem('cc_theme') || 'auto'; } catch (e) { return 'auto'; } }
function themeSet(t) {
  try { localStorage.setItem('cc_theme', t); } catch (e) {}
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  const n = { auto: 'Тема: как в системе', light: 'Тема: светлая', dark: 'Тема: тёмная' }[t];
  $('#themeBtn').innerHTML = I[t === 'auto' ? 'auto' : t === 'light' ? 'sun' : 'moon']; $('#themeBtn').title = n; $('#themeBtn').setAttribute('aria-label', n);
}
const tip = $('#tip');
function route() {
  const h = location.hash.slice(1); let tab = 'recipe';
  if (h.startsWith('card')) { tab = 'card'; renderMol(decodeURIComponent(h.split('/')[1] || '') || CUR_MOL); }
  else if (h === 'method') tab = 'method';
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  ['recipe', 'card', 'method'].forEach(t => { $('#tab-' + t).hidden = t !== tab; });
  if (tab !== 'recipe') window.scrollTo(0, 0);
}

function init() {
  restore(); S.ids.forEach(fillDose); renderMethod();
  if (innerWidth >= 960 || S.cond.length) $('#condBox').open = true;
  bindPicker($('#q').closest('.search'), m => addId(m.id), { multi: true, isAdded: id => S.ids.includes(id) });
  bindPicker($('#q2').closest('.search'), m => { location.hash = '#card/' + m.id; }, { isAdded: id => id === CUR_MOL });
  themeSet(themeGet());
  $('#themeBtn').addEventListener('click', () => { const o = ['auto', 'light', 'dark']; themeSet(o[(o.indexOf(themeGet()) + 1) % 3]); });
  $('#items').addEventListener('click', e => { const r = e.target.closest('[data-rm]'); if (r) { S.ids.splice(+r.dataset.rm, 1); update(); } });
  $('#conds').addEventListener('click', e => { const c = e.target.closest('[data-cond]'); if (!c) return; const k = c.dataset.cond; S.cond = S.cond.includes(k) ? S.cond.filter(x => x !== k) : S.cond.concat(k); update(); });
  $('#condClear').addEventListener('click', () => { S.cond = []; update(); });
  $('#clearBtn').addEventListener('click', () => { S.ids = []; S.dose = {}; update(); });
  $('#items').addEventListener('input', e => { const id = e.target.dataset.dose; if (!id) return; S.dose[id] = Object.assign({}, S.dose[id], { amt: e.target.value === '' ? '' : +e.target.value, unit: (S.dose[id] && S.dose[id].unit) || (id === 'vitd3' ? 'МЕ' : 'мг') }); save(); clearTimeout(window._dt); window._dt = setTimeout(() => { LAST = analyzeDoc(S.ids, S.cond); renderOut(LAST); }, 250); });
  $('#items').addEventListener('change', e => { const id = e.target.dataset.unit; if (!id) return; S.dose[id] = Object.assign({}, S.dose[id], { unit: e.target.value }); update(); });
  document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; if (b.dataset.tab === 'recipe') { history.replaceState(null, '', location.pathname + location.search); route(); } else location.hash = b.dataset.tab === 'card' ? '#card/' + (CUR_MOL || '') : '#method'; });
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-addmol]'); if (a) { addId(a.dataset.addmol); history.replaceState(null, '', location.pathname + location.search); route(); return; }
    const ad = e.target.closest('[data-add]'); if (ad) { addId(ad.dataset.add); return; }
    const m = e.target.closest('[data-mol]'); if (m) { location.hash = '#card/' + m.dataset.mol; return; }
    if (e.target.closest('#copyBtn')) copyText(docReport(LAST) + formsReport(LASTF) + pkReport(LAST));
  });
  document.addEventListener('mouseover', e => { const t = e.target.closest('[title].cpill'); if (t && t.title) { t.dataset.t = t.title; t.removeAttribute('title'); } const d = e.target.closest('[data-t]'); if (d) { tip.textContent = d.dataset.t; tip.hidden = false; } });
  document.addEventListener('mousemove', e => { if (tip.hidden) return; if (!e.target.closest('[data-t]')) { tip.hidden = true; return; } const w = tip.offsetWidth, hh = tip.offsetHeight; let x = e.clientX + 14, y = e.clientY + 14; if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y + hh > innerHeight - 8) y = e.clientY - hh - 14; tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px'; });
  window.addEventListener('hashchange', route);
  update(); route();
}
init();

;document.documentElement.setAttribute("data-theme","light");
